# DS2-FPS-Unlock
# Place xinput1_3.dll and this file next to DarkSoulsII.exe.
# The game loads that DLL name. Do not rename the DLL.
# Scholar of the First Sin uses the 64-bit build.
# The original Dark Souls II uses the 32-bit build.
# The two games cannot share a DLL.
# This mod does not cap the framerate. Cap it with RTSS, the NVIDIA control panel,
# or another limiter, and set PhysicsFPS to that same number.
#
# The original game is DirectX 9. Its unlocked picture is fullscreen only.
# In windowed mode the counter can run ahead of the image, which stays at 60.

[Framerate]
# Set false to leave the game completely unchanged.
FPSUnlock = true

# Expected physics rate given to Havok. Match your external framerate cap.
PhysicsFPS = 120

# While grounded, the game pulls the character down onto the floor every frame, which keeps
# Havok reporting ground contact. At 60 FPS a jump's takeoff moves the body out of that
# contact in one frame; at a high frame rate each frame moves it too little, so jumps on
# steep downhills never left the ground. true lets the body go on exactly the frames where
# 60 FPS would have, so jumps take off (and steep-slope jumps stall) as they do at 60,
# while runs, landings and rolls keep the game's pull. false restores the old workaround
# (never pull), for comparison. JumpHeightFix is accepted as the same key.
GroundSnapFix = true

# Guard break (forward + R1) and jump attack (forward + R2) look for the stick pushed
# forward from neutral in a history of the last 16 frames, which is far too short at a high
# frame rate. true keeps that history as long as it is at 60 FPS, so the inputs are as easy
# as at 60.
ForwardAttackFix = true

# Animation (TAE) events that overlap on the same track repeat their start every frame, so
# backstabs and similar moves could deal or take their effects several times over at a high
# frame rate. true limits the repeats to what 60 FPS gives.
TaeEventFix = true

# Step cloth with the real frame time instead of a fixed 1/60, so capes and cloth move at
# the right speed. ClothSpeedFix is accepted as the same key.
ClothFix = true

# Scale weapon, armor and ring durability loss by the frame time, so equipment wears as
# fast as at 60 FPS (hits are counted again on later frames of the same swing).
DurabilityFix = true

# Diagnostic for jump bug reports: writes the player's per-frame jump physics to
# DS2-FPS-Unlock-jumptrace-*.csv next to the game, one file per launch. Leave false otherwise.
JumpTrace = false
