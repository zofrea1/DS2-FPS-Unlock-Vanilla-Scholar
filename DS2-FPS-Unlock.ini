# DS2-FPS-Unlock
# Place the DLL and this file next to DarkSoulsII.exe.
# Scholar of the First Sin uses the 64-bit build.
# The original Dark Souls II uses the 32-bit build.
# The two games cannot share a DLL.
#
# The DLL is xinput1_3.dll. It can be renamed to another DLL the game loads, if that name
# is free or xinput1_3.dll is taken by another mod:
#   Scholar of the First Sin:  xinput1_3.dll, dxgi.dll or dinput8.dll
#   Original Dark Souls II:    xinput1_3.dll, d3d9.dll or dinput8.dll
# As xinput1_3.dll it passes controller calls on to the system's XInput; under another name
# it passes that DLL's calls on to the real one and the game reads the controller itself.
# The log names the DLL the mod was loaded as.
#
# FPSLimit below caps the framerate. 0 leaves it uncapped, and RTSS, the NVIDIA
# control panel or the Steam Deck's frame limit still work. Set PhysicsFPS to the
# cap you actually run at.
#
# The original game is DirectX 9. Its unlocked picture is fullscreen only.
# In windowed mode the counter can run ahead of the image, which stays at 60.
#
# Steam Deck / Linux (Proton): Wine uses its own copy of a system DLL unless the launch
# options name the DLL, so set them to the name you installed:
#   xinput1_3.dll:  WINEDLLOVERRIDES="xinput1_3=n,b" %command%
#   dxgi.dll:       WINEDLLOVERRIDES="dxgi=n,b" %command%
#   d3d9.dll:       WINEDLLOVERRIDES="d3d9=n,b" %command%
# Two names, for two mods:  WINEDLLOVERRIDES="xinput1_3=n,b;dxgi=n,b" %command%
# dinput8.dll is for Windows only: under Proton it cannot reach Wine's own dinput8.
# dxgi.dll and d3d9.dll need DXVK, which Proton uses unless PROTON_USE_WINED3D is set.

[Framerate]
# Set false to leave the framerate and gameplay unchanged. FixAspect below is separate.
FPSUnlock = true

# Cap in frames per second once FPSUnlock has removed the game's own 60 FPS wait.
# 0 leaves the framerate uncapped. Set PhysicsFPS to this number when it is not 0.
FPSLimit = 0

# Where that cap waits. Restart the game after changing it.
#   early    at the start of the frame, before the pad is read
#   present  just before the picture is shown, after the pad has been read
# Only the one you name waits. early is the lower-lag one when a frame finishes early.
FPSLimitPoint = early

# Expected physics rate given to Havok. Match FPSLimit, your external cap, or the
# refresh rate when VSync below is what holds the framerate.
PhysicsFPS = 120

# While grounded, the game pulls the character down onto the floor every frame, which keeps
# Havok reporting ground contact. At 60 FPS a jump's takeoff moves the body out of that
# contact in one frame; at a high frame rate each frame moves it too little, so jumps on
# steep downhills never left the ground. true lets the body go on exactly the frames where
# 60 FPS would have, so jumps take off (and steep-slope jumps stall) as they do at 60,
# while runs, landings and rolls keep the game's pull. false restores the old workaround
# (never pull), for comparison. JumpHeightFix is accepted as the same key.
GroundSnapFix = true

# Guard break (forward + R1) and jump attack (forward + R2) look for the stick pushed
# forward from neutral in a history of the last 16 frames, which is far too short at a high
# frame rate. true keeps that history as long as it is at 60 FPS, so the inputs are as easy
# as at 60.
ForwardAttackFix = true

# Animation (TAE) events that overlap on the same track repeat their start every frame, so
# backstabs and similar moves could deal or take their effects several times over at a high
# frame rate. true limits the repeats to what 60 FPS gives.
TaeEventFix = true

# Step cloth with the real frame time instead of a fixed 1/60, so capes and cloth move at
# the right speed. ClothSpeedFix is accepted as the same key.
ClothFix = true

# Scale weapon, armor and ring durability loss by the frame time, so equipment wears as
# fast as at 60 FPS (hits are counted again on later frames of the same swing).
DurabilityFix = true

# Diagnostic for jump bug reports: writes the player's per-frame jump physics to
# DS2-FPS-Unlock-jumptrace-*.csv next to the game, one file per launch. Leave false otherwise.
JumpTrace = false

[Display]
# In exclusive fullscreen the game draws a 16:9 picture in the middle of the screen, so a 16:10
# display (the Steam Deck's 1280x800, or 1920x1200) gets black bars. true makes fullscreen fill
# the screen at any aspect ratio, as the game already does in a window, with the HUD at its usual
# size anchored to the screen edges. On a 16:10 screen the game keeps its 16:9 horizontal view
# and shows more above and below.
# Choose your display's own resolution in the game's fullscreen options. Works whether or not
# FPSUnlock is on.
FixAspect = true

# The refresh rate exclusive fullscreen asks for. The games ask for 60 Hz, which held fullscreen
# at 60 FPS (on the Steam Deck even with the screen at 90 Hz). 0 asks for your desktop's own
# refresh rate; a number asks for that rate. Windowed mode is unchanged.
FullscreenRefreshRate = 0

# false presents fullscreen immediately, so the framerate is not held to the screen.
# true waits for one vblank at the refresh rate above: tear-free, and the framerate follows
# the screen unless FPSLimit is lower. Windowed mode is unchanged either way.
VSync = false

[Loader]
# Another mod that needs the same DLL name as this one (for example ReShade as dxgi.dll) can stay:
# rename the other mod's DLL (for example to reshade-dxgi.dll), name it here, and this mod passes
# the calls on to it instead of to the system DLL. A file name is looked up next to this DLL; a
# full path also works. Leave empty when there is no other mod with this DLL's name.
ChainDll =
